<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/"><span class="logo">L</span><span>Lean4All</span></a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="">Discover</a>
        <a href="#/missions" data-nav="missions">Missions</a>

        <a class="btn btn-primary btn-sm" href="#/propose">Propose mission</a>
