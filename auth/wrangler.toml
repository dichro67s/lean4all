name = "lean4all-auth"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Site URL prefixes the Worker may send people back to after sign-in.
ALLOWED_RETURN = "https://dichro67s.github.io/lean4all/,http://localhost:8000/"
# The GitHub App's client ID (not secret). Fill in after creating the app.
GITHUB_CLIENT_ID = ""
# GITHUB_CLIENT_SECRET is a secret: `npx wrangler secret put GITHUB_CLIENT_SECRET`
