statement: '(k : Type*) [Field k] (n : Type*) [Fintype n] [DecidableEq n] : (∀ Y₁ Y₂ : Set (n → k), algebraicSet
  Y₁ → algebraicSet Y₂ → algebraicSet (Y₁ ∪ Y₂)) ∧ (∀ (ι : Type*) (Y : ι → Set (n → k)), (∀ i, algebraicSet
  (Y i)) → algebraicSet (⋂ i, Y i)) ∧ algebraicSet (∅ : Set (n → k)) ∧ algebraicSet (Set.univ : Set (n
  → k))'
