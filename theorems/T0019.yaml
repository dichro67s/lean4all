id: T0019
title: Nakayama's lemma
title_ko: 나카야마 보조정리
description: |-
  Let $A$ be a local ring with maximal ideal $\mathfrak{m}$, and let $M$ be a finitely generated $A$-module.
  (a) If $M = \mathfrak{m}M$, then $M = 0$.
  (b) If $N$ is a submodule of $M$ such that $M = N + \mathfrak{m}M$, then $M = N$.

  *Proposition 1.3 in J.S. Milne, Algebraic Geometry, p. 15. In Lean $\mathfrak{m}M$ is `maximalIdeal R • ⊤`, and $M = 0$ is `Subsingleton M`.*
description_ko: |-
  $A$를 극대 아이디얼 $\mathfrak{m}$을 가진 국소환, $M$을 유한 생성 $A$-가군이라 하자.
  (a) $M = \mathfrak{m}M$이면 $M = 0$이다.
  (b) $N$이 $M$의 부분가군이고 $M = N + \mathfrak{m}M$이면 $M = N$이다.

  *J.S. Milne, Algebraic Geometry, 15쪽의 Proposition 1.3. Lean에서 $\mathfrak{m}M$은 `maximalIdeal R • ⊤`, $M = 0$은 `Subsingleton M`으로 나타낸다.*
statement: |-
  (R : Type*) [CommRing R] [IsLocalRing R] (M : Type*) [AddCommGroup M] [Module R M]
      [Module.Finite R M] :
      ((⊤ : Submodule R M) = IsLocalRing.maximalIdeal R • ⊤ → Subsingleton M) ∧
        ∀ N : Submodule R M, (⊤ : Submodule R M) = N ⊔ IsLocalRing.maximalIdeal R • ⊤ → N = ⊤
tags:
- Mathematics
- Commutative Algebra
source: J.S. Milne, Algebraic Geometry, p. 15, Proposition 1.3
mission: algebraic-geometry
proposer: Sanghyeok0
