id: T0001
title: There are infinitely many primes
description: |
  For every natural number $n$ there is a prime $p$ with $n \le p$.
  This is Euclid's theorem (*Elements*, Book IX, Proposition 20).
title_ko: "소수는 무한히 많다"
description_ko: |
  모든 자연수 $n$에 대해 $n \le p$인 소수 $p$가 존재한다.
  유클리드의 정리이다(『원론』 9권 명제 20).
statement: "(n : ℕ) : ∃ p, n ≤ p ∧ Nat.Prime p"
tags: [Number Theory]
source: Euclid, Elements IX.20
mission: euclid-primes
