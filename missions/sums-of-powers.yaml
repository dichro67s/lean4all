id: sums-of-powers
title: "Sums of Powers: From Gauss to Nicomachus"
type: Textbook
tags: [Combinatorics, Algebra]
captain: dichro67s
reviewed: true
summary: Closed forms for sums of consecutive integers and cubes.
description: |
  The triangular numbers $T_n = n(n+1)/2$ and the identity
  $1^3 + 2^3 + \dots + n^3 = T_n^2$. The goal, Nicomachus's theorem, is still open. A good
  route is to prove $4\sum i^3 = (n(n+1))^2$ by induction and combine it with Gauss's formula.
source:
  title: Concrete Mathematics (Graham, Knuth, Patashnik), §2.5
goal: T0007
milestones:
  - title: Gauss's formula
    statement: "$2\\sum_{i=0}^n i = n(n+1)$"
    theorem: T0006
  - title: Nicomachus's theorem
    statement: "$\\sum_{i=0}^n i^3 = \\left(\\sum_{i=0}^n i\\right)^2$"
    theorem: T0007
