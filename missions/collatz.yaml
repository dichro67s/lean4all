id: collatz
title: Collatz Conjecture
title_ko: 콜라츠 추측
type: Open Problem
tags:
- Number Theory
- Dynamical Systems
captain: dichro67s
reviewed: true
summary: 'The 3n + 1 problem: does every orbit reach 1?'
summary_ko: '3n + 1 문제: 모든 궤도는 1에 도달하는가?'
description: |
  An open problem. A complete proof would be a major result, but partial progress is
  welcome: propose lemmas (for example, that orbits of powers of two reach 1) and prove them.
description_ko: 미해결 문제입니다. 완전한 증명은 중대한 결과가 되겠지만, 부분적인 진전도 환영합니다. 예를 들어 2의 거듭제곱의 궤도가 1에 도달한다는 보조정리를 제안하고
  증명해 보세요.
source:
  title: J. C. Lagarias, The 3x+1 problem and its generalizations (1985)
  url: https://doi.org/10.2307/2322189
goal: T0009
milestones:
- title: Collatz conjecture
  statement: For every $n \ge 1$ some iterate of the Collatz map sends $n$ to $1$.
  theorem: T0009
  title_ko: 콜라츠 추측
  statement_ko: $n \ge 1$이면 콜라츠 함수를 여러 번 적용해 $n$을 $1$로 보낼 수 있다.
