milestones:
- title: 'Theorem 1.1: Chinese Remainder Theorem'
  title_ko: 'Theorem 1.1: 중국 나머지 정리'
  statement: Let $A$ be a commutative ring and $\mathfrak{a}_1, \dots, \mathfrak{a}_n$ be ideals in $A$.
    If $\mathfrak{a}_i + \mathfrak{a}_j = A$ for all $i \neq j$, then the canonical map $A \to \prod_{i=1}^n
    A/\mathfrak{a}_i$ is surjective, and its kernel is $\bigcap_{i=1}^n \mathfrak{a}_i$.
  statement_ko: $A$를 가환환, $\mathfrak{a}_1, \dots, \mathfrak{a}_n$을 $A$의 이념이라고 하자. 모든 $i \neq j$에 대해 $\mathfrak{a}_i
    + \mathfrak{a}_j = A$라면, 표준 사상 $A \to \prod_{i=1}^n A/\mathfrak{a}_i$는 전단사이며, 그 핵은 $\bigcap_{i=1}^n
    \mathfrak{a}_i$이다.
- title: 'Proposition 1.2: Equivalence of Noetherian Conditions'
  title_ko: 'Proposition 1.2: 뇌터 환의 동치 조건'
  statement: 'The following three conditions on a commutative ring $A$ are equivalent: (a) every ideal
    in $A$ is finitely generated; (b) every ascending chain of ideals $\mathfrak{a}_1 \subseteq \mathfrak{a}_2
    \subseteq \dots$ eventually becomes constant; (c) every nonempty set of ideals in $A$ has a maximal
    element.'
  statement_ko: '가환환 $A$에 대해 다음 세 조건은 동치이다: (a) $A$의 모든 아이디얼은 유한 생성이다; (b) $A$의 모든 상승 아이디얼 연쇄 $\mathfrak{a}_1
    \subseteq \mathfrak{a}_2 \subseteq \dots$는 결국 일정해진다; (c) $A$의 모든 공집합이 아닌 아이디얼의 집합은 극대원을 가진다.'
- title: 'Proposition 1.3: Nakayama''s Lemma'
  title_ko: 'Proposition 1.3: 나카야마의 보조정리'
  statement: |-
    Let $A$ be a local ring with maximal ideal $\mathfrak{m}$, and let $M$ be a finitely generated $A$-module.
    (a) If $M = \mathfrak{m}M$, then $M = 0$.
    (b) If $N$ is a submodule of $M$ such that $M = N + \mathfrak{m}M$, then $M = N$.
  statement_ko: |-
    $A$를 극대 아이디얼 $\mathfrak{m}$을 가진 국소환이라 하고, $M$을 유한 생성 $A$-가군이라 하자.
    (a) $M = \mathfrak{m}M$이면 $M = 0$이다.
    (b) $N$이 $M$의 부분가군이고 $M = N + \mathfrak{m}M$이면 $M = N$이다.
- title: 'Corollary 1.4: Nakayama''s Lemma: Generators of Maximal Ideal'
  title_ko: 'Corollary 1.4: 나카야마 보조정리: 극대 아이디얼의 생성원'
  statement: Let $R$ be a local ring with maximal ideal $\mathfrak{m}$ and residue field $k = R/\mathfrak{m}$.
    Let $a_1, \dots, a_n$ be elements of $\mathfrak{m}$. Then $a_1, \dots, a_n$ generate $\mathfrak{m}$
    as an ideal if and only if their images in the cotangent space $\mathfrak{m}/\mathfrak{m}^2$ span
    this space as a vector space over $k$.
  statement_ko: $R$을 극대 아이디얼 $\mathfrak{m}$과 잉여체 $k = R/\mathfrak{m}$을 가진 국소환이라고 하자. $a_1, \dots, a_n$이
    $\mathfrak{m}$의 원소일 때, $a_1, \dots, a_n$이 아이디얼로서 $\mathfrak{m}$을 생성할 필요충분조건은, $\mathfrak{m}/\mathfrak{m}^2$에서의
    상(image)들이 $k$-벡터공간으로서 $\mathfrak{m}/\mathfrak{m}^2$을 생성하는 것이다.
