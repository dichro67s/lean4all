milestones:
- title: 'Property 1: SA-Pass with Complete Shadow Set Implies Logical Equivalence'
  title_ko: 'Property 1: 완전한 그림자 집합에 대한 SA-Pass 통과가 논리적 동치를 함의함'
  statement: Let $T$ be the intended theorem and $\widehat{T}$ be a generated statement. Let $\mathcal{S}$
    be a finite set of shadow statements. If $\mathcal{S}$ is a complete shadow set for $T$ (meaning $\bigwedge_{S
    \in \mathcal{S}} S \Leftrightarrow T$) and $\widehat{T}$ passes the SA-Pass metric with respect to
    $\mathcal{S}$ (meaning $\widehat{T} \Rightarrow S$ for all $S \in \mathcal{S}$ and $\bigwedge_{S \in
    \mathcal{S}} S \Rightarrow \widehat{T}$), then $\widehat{T}$ is logically equivalent to $T$ ($\widehat{T}
    \Leftrightarrow T$).
  statement_ko: $T$를 의도된 정리, $\widehat{T}$를 생성된 명제라고 하자. $\mathcal{S}$를 그림자 명제들의 유한 집합이라고 하자. 만약 $\mathcal{S}$가
    $T$에 대한 완전한 그림자 집합(즉, $\bigwedge_{S \in \mathcal{S}} S \Leftrightarrow T$)이고, $\widehat{T}$가 $\mathcal{S}$에
    대해 SA-Pass 지표(즉, 모든 $S \in \mathcal{S}$에 대해 $\widehat{T} \Rightarrow S$이며 $\bigwedge_{S \in \mathcal{S}}
    S \Rightarrow \widehat{T}$)를 통과한다면, $\widehat{T}$는 $T$와 논리적으로 동치($\widehat{T} \Leftrightarrow T$)이다.
  theorem: T0011
- title: 'Property 2: Logical Equivalence Implies SA-Pass'
  title_ko: 'Property 2: 논리적 동치는 SA-Pass 통과를 함의함'
  statement: Let $T$ be the intended theorem, $\widehat{T}$ be a generated statement, and $\mathcal{S}$
    be a set of shadow statements. If $\widehat{T}$ is logically equivalent to $T$ (i.e., $\widehat{T}
    \leftrightarrow T$) and $\mathcal{S}$ is a complete shadow set for $T$, then $\widehat{T}$ passes
    the SA-Pass metric. Specifically, the forward check holds ($\forall S \in \mathcal{S}, \widehat{T}
    \to S$) and the backward check holds ($(\forall S \in \mathcal{S}, S) \to \widehat{T}$).
  statement_ko: $T$를 의도된 정리, $\widehat{T}$를 생성된 명제, $\mathcal{S}$를 그림자 명제들의 집합이라고 하자. 만약 $\widehat{T}$가
    $T$와 논리적으로 동치라면 (즉, $\widehat{T} \leftrightarrow T$) 그리고 $\mathcal{S}$가 $T$에 대한 완전한 그림자 집합이라면, $\widehat{T}$는
    SA-Pass 지표를 통과한다. 구체적으로, 전방 검사($\forall S \in \mathcal{S}, \widehat{T} \to S$)와 후방 검사($(\forall S
    \in \mathcal{S}, S) \to \widehat{T}$)가 모두 성립한다.
  theorem: T0012
- title: 'Property 3: Monotonicity of Forward Check'
  title_ko: 'Property 3: 순방향 검사(Foward Check)의 단조성'
  statement: Let $\mathcal{S}_1$ and $\mathcal{S}_2$ be two shadow sets such that $\mathcal{S}_1 \subseteq
    \mathcal{S}_2$. If a generated statement $\widehat{T}$ passes the forward checks for $\mathcal{S}_2$
    (i.e., $\forall s \in \mathcal{S}_2, \widehat{T} \Rightarrow s$), then it also passes the forward
    checks for $\mathcal{S}_1$.
  statement_ko: $\mathcal{S}_1 \subseteq \mathcal{S}_2$인 두 그림자 집합 $\mathcal{S}_1$과 $\mathcal{S}_2$가 있다고
    하자. 생성된 명제 $\widehat{T}$가 $\mathcal{S}_2$에 대한 순방향 검사를 통과하면(즉, $\forall s \in \mathcal{S}_2, \widehat{T}
    \Rightarrow s$), $\mathcal{S}_1$에 대한 순방향 검사도 통과한다.
  theorem: T0013
- title: 'Property 4: Equivalence of SA-Pass and Relaxed Score'
  title_ko: 'Property 4: SA-Pass와 Relaxed 점수의 동치성'
  statement: For a generated statement $\widehat T$ and a set of shadow statements $\mathcal{S}$, the
    binary SA-Pass outcome is 1 (true) if and only if the relaxed SA-Pass score is 1.
  statement_ko: 생성된 명제 $\widehat T$와 그림자 명제 집합 $\mathcal{S}$에 대해, 이진 SA-Pass 결과가 1(true)인 것은 relaxed SA-Pass
    점수가 1인 것과 동치이다.
- title: 'Property 5: Completeness of the Empty Shadow Set'
  title_ko: 'Property 5: 빈 그림자 집합의 완전성'
  statement: The empty set $\emptyset$ is a complete shadow set for the intended theorem $T$ if and only
    if $T$ is logically true ($T \Leftrightarrow \top$).
  statement_ko: 빈 집합 $\emptyset$가 의도된 정리 $T$에 대한 완전한 그림자 집합일 필요충분조건은 $T$가 논리적으로 참인 것($T \Leftrightarrow
    \top$)이다.
  theorem: T0014
- title: 'Property 6: Forward Check Passes for Tautological Shadows'
  title_ko: 'Property 6: 항진 명제 그림자에 대한 전방 검사 통과'
  statement: Let $\widehat{T}$ be a generated statement and $S$ be a shadow statement. If $S$ is logically
    true (i.e., $S \Leftrightarrow \top$), then $\widehat{T}$ passes the forward check for $S$ (i.e.,
    $\widehat{T} \Rightarrow S$).
  statement_ko: 생성된 명제 $\widehat{T}$와 그림자 명제 $S$가 주어졌을 때, $S$가 논리적으로 참이면(즉, $S \Leftrightarrow \top$),
    $\widehat{T}$는 $S$에 대한 전방 검사를 통과합니다(즉, $\widehat{T} \Rightarrow S$가 성립합니다).
  theorem: T0015
