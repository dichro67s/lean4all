name: Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - run: python3 -m pip install pyyaml
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Verify proofs and contribution rules
        env:
          BASE: origin/${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/lean4all.py verify --base "$BASE" --author "$AUTHOR"
